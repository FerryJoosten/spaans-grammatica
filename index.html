<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spaans Trainer – Brugklas VWO</title><style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#667085;--accent:#6d4aff;--ok:#087443;--bad:#b42318;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:900px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand h1{margin:0;font-size:26px}.brand p{margin:5px 0;color:var(--muted)}.pill{background:#eeeaff;color:#4c35c5;padding:8px 12px;border-radius:999px;font-weight:700}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 6px 20px #1018280a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.topic{border:1px solid var(--line);background:#fff;border-radius:14px;padding:16px;text-align:left;cursor:pointer}.topic:hover,.topic.active{border-color:var(--accent);box-shadow:0 0 0 2px #6d4aff18}.topic b{display:block;margin-bottom:5px}.topic small{color:var(--muted)}button{font:inherit}.primary,.secondary{border:0;border-radius:12px;padding:12px 16px;font-weight:750;cursor:pointer}.primary{background:var(--accent);color:white}.secondary{background:#f0efff;color:#4933bf}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.hidden{display:none!important}.qhead{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}.question{font-size:24px;font-weight:750;line-height:1.35;margin:22px 0 8px}.instruction{color:var(--muted);margin-bottom:16px}.answer{width:100%;padding:14px 15px;border:1px solid #cfd4dc;border-radius:12px;font-size:18px;outline:none}.answer:focus{border-color:var(--accent);box-shadow:0 0 0 3px #6d4aff1c}.chars{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 16px}.char{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer}.feedback{margin:14px 0;padding:12px 14px;border-radius:12px}.good{background:#ecfdf3;color:var(--ok)}.bad{background:#fff1f0;color:var(--bad)}.theory h3{margin-top:0}.theory table{border-collapse:collapse;width:100%;max-width:520px}.theory td,.theory th{padding:8px;border-bottom:1px solid var(--line);text-align:left}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f8f9fc;border-radius:12px;padding:12px;text-align:center}.stat b{font-size:20px;display:block}.bar{height:8px;background:#eceef2;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--accent);width:0}.footer{color:var(--muted);font-size:12px;text-align:center;margin:20px}.choice{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:white;cursor:pointer}.choice.sel{border-color:var(--accent);background:#f3f0ff}@media(max-width:600px){.wrap{padding:14px}.question{font-size:21px}.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap"><div class="top"><div class="brand"><h1>🇪🇸 Spaans Trainer</h1><p>Brugklas VWO · Unidad 1</p></div><span class="pill" id="streak">0 goed</span></div>
<div id="home" class="card"><h2>Kies wat je wilt oefenen</h2><div class="grid" id="topics"></div><h3 style="margin-top:22px">Aantal vragen</h3><div class="row" id="lengths"><button class="choice sel" data-n="10">10</button><button class="choice" data-n="20">20</button><button class="choice" data-n="30">30</button><button class="choice" data-n="0">Eindeloos</button></div><div class="row" style="margin-top:18px"><button class="primary" id="start">Start oefenen</button><button class="secondary" id="theoryBtn">Theorie</button><button class="secondary" id="mistakesBtn">Oefen mijn fouten</button></div></div>
<div id="theory" class="card theory hidden"><div class="row" style="justify-content:space-between"><h2>Theorie</h2><button class="secondary" onclick="showHome()">Terug</button></div><div id="theoryBody"></div></div>
<div id="quiz" class="card hidden"><div class="qhead"><span id="progress"></span><span id="score"></span></div><div class="bar"><i id="bar"></i></div><div class="question" id="question"></div><div class="instruction" id="instruction"></div><input id="answer" class="answer" autocomplete="off" autocapitalize="none" placeholder="Typ je antwoord…"><div class="chars">á é í ó ú ñ ü ¿ ¡</div><div id="feedback"></div><div class="row"><button class="primary" id="check">Controleren</button><button class="primary hidden" id="next">Volgende</button><button class="secondary" onclick="showHome()">Stoppen</button></div></div>
<div id="result" class="card hidden"><h2>Klaar!</h2><div class="stats"><div class="stat"><b id="rscore">0/0</b>goed</div><div class="stat"><b id="rpercent">0%</b>score</div><div class="stat"><b id="rweak">—</b>extra oefenen</div></div><p id="resultText"></p><div class="row"><button class="primary" onclick="restart()">Nog een ronde</button><button class="secondary" onclick="showHome()">Andere keuze</button></div></div><div class="footer">Voortgang wordt alleen lokaal in deze browser bewaard.</div></div>
<script>
const TOPICS={ser:['Ser','Vormen van ser invullen'],verbs:['Llamarse','Vormen van llamarse oefenen'],pronouns:['Persoonlijke voornaamwoorden','yo, tú, él, ella…'],translate:['Korte zinnen vertalen','Nederlands → Spaans · Unidad 1'],articles:['Lidwoorden','el, la, los, las · un, una…'],gender:['Mannelijk & vrouwelijk','compañero → compañera'],plural:['Enkelvoud & meervoud','-s en -es'],mixed:['Alles door elkaar','Alle onderdelen gemengd']};
let selected='mixed',limit=10,current=0,correct=0,attempt=0,q=null,sessionErrors={},mistakeMode=false;
const formsSer={yo:'soy',tú:'eres',él:'es',ella:'es',usted:'es',nosotros:'somos',nosotras:'somos',vosotros:'sois',vosotras:'sois',ellos:'son',ellas:'son',ustedes:'son'};
const formsLlamarse={yo:'me llamo',tú:'te llamas',él:'se llama',ella:'se llama',usted:'se llama',nosotros:'nos llamamos',nosotras:'nos llamamos',vosotros:'os llamáis',vosotras:'os llamáis',ellos:'se llaman',ellas:'se llaman',ustedes:'se llaman'};
const verbData={llamarse:{meaning:'heten',forms:formsLlamarse}};
const translations=[
 ['Ik heet Ana.',['me llamo ana']],['Hoe heet je?',['¿cómo te llamas?','cómo te llamas']],['Ik ben elf jaar.',['tengo once años']],['Ik ben twaalf jaar.',['tengo doce años']],['Ik ben dertien jaar.',['tengo trece años']],['Hoe oud ben je?',['¿cuántos años tienes?','cuántos años tienes']],['Ik kom uit Nederland.',['soy de holanda']],['Mijn naam is Ana.',['mi nombre es ana']],['Wie ben jij?',['¿quién eres?','quién eres']],['Ik ben een leerling.',['soy un alumno','soy una alumna']],['Ik ben een student.',['soy un estudiante','soy una estudiante']],['Het is een boek.',['es un libro']],['Het is een potlood.',['es un lápiz']],['Het is een rugzak.',['es una mochila']],['Het is een tafel.',['es una mesa']],['Het is een computer.',['es un ordenador']],['Het is een woordenboek.',['es un diccionario']],['Het is een stoel.',['es una silla']],['Het is een oefening.',['es un ejercicio']],['Het is een schrift.',['es un cuaderno']],['Het is een vraag.',['es una pregunta']],['Het is een antwoord.',['es una respuesta']],['Goedemorgen.',['buenos días']],['Goedemiddag.',['buenas tardes']],['Goedenavond.',['buenas noches']],['Hallo!',['¡hola!','hola']],['Hoe gaat het?',['¿qué tal?','qué tal']],['Het team leest.',['el equipo lee']],['De leerling schrijft.',['el alumno escribe','la alumna escribe']],['De leraar spreekt.',['el profesor habla']],['De lerares spreekt.',['la profesora habla']],['De klasgenoot luistert.',['el compañero escucha','la compañera escucha']],['De leerling vraagt.',['el alumno pregunta','la alumna pregunta']],['De leerling antwoordt.',['el alumno contesta','la alumna contesta']],['Wij leren.',['aprendemos']],['Jullie lezen.',['leéis']],['Zij schrijven.',['escriben']]
];
const nouns=[['lápiz','m'],['regla','f'],['mochila','f'],['borrador','m'],['mesa','f'],['pizarra','f'],['bolígrafo','m'],['diccionario','m'],['silla','f'],['libro','m'],['ordenador','m'],['ejercicio','m'],['cuaderno','m'],['sacapuntas','m'],['tijeras','fp'],['goma','f'],['pregunta','f'],['respuesta','f'],['cultura','f'],['abecedario','m'],['página','f'],['diálogo','m'],['equipo','m'],['mapa','m'],['ciudad','f'],['lengua','f'],['capital','f'],['centro','m'],['país','m'],['mar','m'],['año','m'],['casa','f'],['coche','m'],['padre','m'],['madre','f'],['estudiante','m']];
const pairs=[['compañero','compañera'],['hermano','hermana'],['alumno','alumna'],['camarero','camarera'],['chico','chica'],['enfermero','enfermera'],['profesor','profesora']];
const pronouns=['yo','tú','él','ella','usted','nosotros','nosotras','vosotros','vosotras','ellos','ellas','ustedes'];
function pick(a){return a[Math.floor(Math.random()*a.length)]}function norm(s){return s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.?!¡¿]/g,'').replace(/\s+/g,' ')}function accentDiff(a,b){return norm(a)===norm(b)&&a.trim().toLowerCase()!==b.trim().toLowerCase()}
function makeQ(topic){if(topic==='mixed')topic=pick(Object.keys(TOPICS).filter(x=>x!=='mixed')); if(topic==='ser'){let p=pick(pronouns);return{topic,prompt:`${p[0].toUpperCase()+p.slice(1)} ___ de Holanda.`,inst:'Vul de juiste vorm van ser in.',ans:[formsSer[p]],hint:'Kijk naar het persoonlijke voornaamwoord.'}} if(topic==='verbs'){let p=pick(pronouns),v=pick(Object.keys(verbData)),d=verbData[v];return{topic,prompt:`${p[0].toUpperCase()+p.slice(1)} — ${v} (${d.meaning}) → ___`,inst:'Vul de juiste vorm van het werkwoord in.',ans:[d.forms[p]],hint:v==='llamarse'?'Denk bij llamarse ook aan me/te/se/nos/os/se.':'Kijk naar het onderwerp en de uitgang van het werkwoord.'}} if(topic==='pronouns'){let p=pick(pronouns);let s=formsSer[p];return{topic,prompt:`___ ${s} de Holanda.`,inst:`Welk persoonlijk voornaamwoord past?`,ans:Object.keys(formsSer).filter(k=>formsSer[k]===s),hint:'Kijk naar de vorm van ser.'}} if(topic==='translate'){let x=pick(translations);return{topic,prompt:x[0],inst:'Vertaal de korte zin naar het Spaans.',ans:x[1],hint:'Gebruik de woorden en grammatica uit Unidad 1.'}} if(topic==='articles'){let [n,g]=pick(nouns);let definite=Math.random()<.5;let plural=g.endsWith('p');let fem=g.startsWith('f');let art=definite?(plural?(fem?'las':'los'):(fem?'la':'el')):(plural?(fem?'unas':'unos'):(fem?'una':'un'));return{topic,prompt:`___ ${n}`,inst:`Vul het ${definite?'bepaalde':'onbepaalde'} lidwoord in.`,ans:[art],hint:`Let op: ${plural?'meervoud':'enkelvoud'} en ${fem?'vrouwelijk':'mannelijk'}.`}} if(topic==='gender'){let [m,f]=pick(pairs),toF=Math.random()<.5;return{topic,prompt:`${toF?m:f} → ___`,inst:`Maak het woord ${toF?'vrouwelijk':'mannelijk'}.`,ans:[toF?f:m],hint:'Bij deze woorden verandert meestal de laatste -o/-a.'}} if(topic==='plural'){let candidates=nouns.filter(x=>!x[1].endsWith('p'));let [n]=pick(candidates);let pl=n.endsWith('z')?n.slice(0,-1)+'ces':(/[aeiouáéíóú]$/i.test(n)?n+'s':n+'es');return{topic,prompt:`${n} → ___`,inst:'Schrijf het meervoud.',ans:[pl],hint:/[aeiouáéíóú]$/i.test(n)?'Na een klinker komt meestal -s.':'Na een medeklinker komt meestal -es.'}}
}
function renderTopics(){let box=document.querySelector('#topics');box.innerHTML='';for(let [k,v] of Object.entries(TOPICS)){let b=document.createElement('button');b.className='topic'+(k===selected?' active':'');b.innerHTML=`<b>${v[0]}</b><small>${v[1]}</small>`;b.onclick=()=>{selected=k;renderTopics()};box.appendChild(b)}}renderTopics();
document.querySelectorAll('#lengths .choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('#lengths .choice').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');limit=+b.dataset.n});
function start(mode=false){mistakeMode=mode;current=0;correct=0;attempt=0;sessionErrors={};hideAll();document.querySelector('#quiz').classList.remove('hidden');nextQ()}
function nextQ(){if(limit&&current>=limit)return finish();current++;attempt=0;let t=selected;if(mistakeMode){let saved=JSON.parse(localStorage.getItem('spaansMistakes')||'{}');let ks=Object.keys(saved).filter(k=>saved[k]>0);t=ks.length?pick(ks):selected}q=makeQ(t);document.querySelector('#question').textContent=q.prompt;document.querySelector('#instruction').textContent=q.inst;document.querySelector('#answer').value='';document.querySelector('#answer').disabled=false;document.querySelector('#feedback').innerHTML='';document.querySelector('#check').classList.remove('hidden');document.querySelector('#next').classList.add('hidden');document.querySelector('#progress').textContent=limit?`Vraag ${current} van ${limit}`:`Vraag ${current}`;document.querySelector('#score').textContent=`${correct} goed`;document.querySelector('#bar').style.width=limit?`${(current-1)/limit*100}%`:'0';setTimeout(()=>document.querySelector('#answer').focus(),20)}
function check(){let val=document.querySelector('#answer').value;if(!val.trim())return;let ok=q.ans.some(a=>norm(a)===norm(val));let fb=document.querySelector('#feedback');if(ok){correct++;let exact=q.ans.some(a=>a.toLowerCase()===val.trim().toLowerCase());fb.className='feedback good';fb.innerHTML=`✓ Goed!${!exact?' <small>Let op de juiste accenten/spelling: <b>'+q.ans[0]+'</b>.</small>':''}`;document.querySelector('#streak').textContent=`${correct} goed`;doneQ(true)}else if(attempt===0){attempt++;fb.className='feedback bad';fb.innerHTML=`Nog niet. ${q.hint} Probeer nog eens.`;document.querySelector('#answer').select()}else{fb.className='feedback bad';fb.innerHTML=`Het juiste antwoord is <b>${q.ans[0]}</b>. ${q.hint}`;sessionErrors[q.topic]=(sessionErrors[q.topic]||0)+1;doneQ(false)}}
function doneQ(ok){document.querySelector('#answer').disabled=true;document.querySelector('#check').classList.add('hidden');document.querySelector('#next').classList.remove('hidden');document.querySelector('#score').textContent=`${correct} goed`;if(limit)document.querySelector('#bar').style.width=`${current/limit*100}%`;let saved=JSON.parse(localStorage.getItem('spaansMistakes')||'{}');saved[q.topic]=Math.max(0,(saved[q.topic]||0)+(ok?-1:1));localStorage.setItem('spaansMistakes',JSON.stringify(saved))}
function finish(){hideAll();document.querySelector('#result').classList.remove('hidden');let pct=Math.round(correct/current*100)||0;document.querySelector('#rscore').textContent=`${correct}/${current}`;document.querySelector('#rpercent').textContent=pct+'%';let weak=Object.keys(sessionErrors).sort((a,b)=>sessionErrors[b]-sessionErrors[a])[0];document.querySelector('#rweak').textContent=weak?TOPICS[weak][0]:'Geen';document.querySelector('#resultText').textContent=pct>=80?'Sterk gewerkt. Kies eventueel een onderdeel om nog gerichter te oefenen.':'Oefen de onderdelen waarop je fouten maakte nog een keer.'}
function hideAll(){['home','theory','quiz','result'].forEach(id=>document.querySelector('#'+id).classList.add('hidden'))}function showHome(){hideAll();document.querySelector('#home').classList.remove('hidden');renderTopics()}function restart(){start(false)}
document.querySelector('#start').onclick=()=>start(false);document.querySelector('#mistakesBtn').onclick=()=>start(true);document.querySelector('#check').onclick=check;document.querySelector('#next').onclick=nextQ;document.querySelector('#answer').addEventListener('keydown',e=>{if(e.key==='Enter'){if(!document.querySelector('#check').classList.contains('hidden'))check();else nextQ()}});document.querySelectorAll('.char').forEach(c=>c.onclick=()=>{let a=document.querySelector('#answer');a.value+=c.textContent;a.focus()});
const theory=`<h3>Ser – zijn</h3><table><tr><td>yo</td><td>soy</td><td>nosotros/as</td><td>somos</td></tr><tr><td>tú</td><td>eres</td><td>vosotros/as</td><td>sois</td></tr><tr><td>él/ella/usted</td><td>es</td><td>ellos/ellas/ustedes</td><td>son</td></tr></table><h3>Llamarse – heten</h3><table><tr><td>yo</td><td>me llamo</td><td>nosotros/as</td><td>nos llamamos</td></tr><tr><td>tú</td><td>te llamas</td><td>vosotros/as</td><td>os llamáis</td></tr><tr><td>él/ella/usted</td><td>se llama</td><td>ellos/ellas/ustedes</td><td>se llaman</td></tr></table><h3>Lidwoorden</h3><p><b>Bepaald:</b> el, la, los, las · <b>Onbepaald:</b> un, una, unos, unas.</p><h3>Meervoud</h3><p>Na een klinker meestal <b>-s</b>: casa → casas. Na een medeklinker meestal <b>-es</b>: ciudad → ciudades.</p><h3>Llamarse</h3><p>Bij dit onderdeel oefen je alleen <b>llamarse</b> (heten), inclusief me/te/se/nos/os/se.</p><h3>Korte zinnen vertalen</h3><p>Vertaal Nederlands naar Spaans met de woorden en grammatica uit <b>Unidad 1</b>. Accenten worden niet fout gerekend, maar de app wijst je er wel op.</p>`;document.querySelector('#theoryBody').innerHTML=theory;document.querySelector('#theoryBtn').onclick=()=>{hideAll();document.querySelector('#theory').classList.remove('hidden')};
</script></body></html>
